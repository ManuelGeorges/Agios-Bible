apply plugin: 'com.android.application'
apply plugin: 'com.google.firebase.crashlytics'

android {
    signingConfigs {
        release {
            // Use a path relative to the project root to avoid drive letter issues
            def keystoreFile = rootProject.file("E://AlMalak system//Agios Bible//website/my-release-key.jks")
            storeFile file('E:\\AlMalak system\\Agios Bible\\website\\my-release-key.jks')
            if (keystoreFile.exists()) {
                storeFile keystoreFile
            } else {
                // Fallback or warning if file is missing in the expected location
                println("Warning: Keystore file not found at ${keystoreFile.absolutePath}")
            }

            // These properties should ideally be in local.properties or environment variables
            // storePassword 'your_password'
            // keyAlias 'your_alias'
            // keyPassword 'your_password'
        }
    }
    namespace = "com.agios.bible"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.agios.bible"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 125
        versionName "2.6.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    
    // Firebase & Google Play Services
    implementation(platform("com.google.firebase:firebase-bom:33.10.0"))
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
    implementation 'com.google.android.play:app-update:2.1.0'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied.")
}